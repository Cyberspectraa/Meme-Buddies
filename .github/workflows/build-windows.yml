name: Windows portable EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Build Meme Buddies for Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and verify
        run: |
          npm install
          npm test
      - name: Validate desktop scripts
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
      - name: Build unsigned portable EXE
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meme-Buddies-Windows
          path: dist/Meme-Buddies-Windows.exe
          if-no-files-found: error
      - name: Publish portable download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.4.0"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Meme Buddies v0.4.0" --notes "Portable Windows x64 app with a new optional transparent, click-through desktop overlay. Use Show buddies in the app and capture the same monitor with TikTok LIVE Studio Display Capture; no localhost Link Source required. Connect to TikFinity Desktop for live gifts and chat. Put PNGs in the memes folder next to the EXE. !meme for top-three gifters retains its shared two-minute cooldown. Unsigned; Windows may warn."
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $tag dist/Meme-Buddies-Windows.exe --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
