name: Windows portable EXE
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    name: Build Meme Buddies for Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install and verify
        run: |
          npm install
          npm test
      - name: Validate desktop scripts
        run: |
          node --check desktop/main.cjs
          node --check desktop/preload.cjs
      - name: Build unsigned portable EXE
        run: npm run build:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: Meme-Buddies-Windows
          path: dist/Meme-Buddies-Windows.exe
          if-no-files-found: error
      - name: Publish portable download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v0.5.0"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Meme Buddies v0.5.0" --notes "Portable Windows x64 app with a centred TikTok portrait 9:16 desktop capture area and a general top 3 participation leaderboard (chat, likes, shares, follows, subscriptions and gifts). Connect TikFinity Desktop, show buddies, then crop LIVE Studio Display Capture to the portrait strip. Top three active viewers can use !meme, with the same shared two-minute cooldown. Unsigned; Windows may warn."
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $tag dist/Meme-Buddies-Windows.exe --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { exit 1 }
