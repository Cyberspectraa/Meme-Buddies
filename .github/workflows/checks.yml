name: Meme Buddies checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts
      - run: npm test
      - run: node --check server.js
      - name: Check inline browser JS syntax
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import vm from "node:vm";
            for (const file of ["public/control.html", "public/overlay.html"]) {
              const match = fs.readFileSync(file, "utf8").match(/<script>([\\s\\S]*?)<\\/script>/);
              if (!match) throw new Error("Missing inline script in " + file);
              new vm.Script(match[1], { filename: file });
            }
          '
      - name: Smoke test local overlay
        run: |
          node server.js &
          SERVER_PID=$!
          trap "kill $SERVER_PID 2>/dev/null || true" EXIT
          sleep 2
          curl -fsS http://127.0.0.1:3927/api/state
          curl -fsS http://127.0.0.1:3927/overlay > /dev/null
          curl -fsS http://127.0.0.1:3927/ > /dev/null
