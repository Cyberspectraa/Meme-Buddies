<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meme Buddies • Overlay</title>
<style>
*{box-sizing:border-box}
html,body{padding:0;margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
body{user-select:none;pointer-events:none;font-family:system-ui,Segoe UI,sans-serif}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden}
.buddy{width:92px;height:113px;position:absolute;top:0;left:0;will-change:transform}
.face{position:absolute;left:10px;top:8px;width:72px;height:72px;display:grid;place-items:center;border-radius:50%;overflow:hidden;background:linear-gradient(135deg,#553a87,#d24dbe);border:4px solid var(--ring);box-shadow:0 5px 15px #000a}
.face img{width:100%;height:100%;object-fit:cover}
.face .initial{font-weight:900;color:#fff;font-size:30px}
.buddy .rank{position:absolute;top:0;left:0;background:var(--ring);color:#271c35;border-radius:100%;width:28px;height:28px;display:grid;place-items:center;font-size:16px;font-weight:900;box-shadow:0 2px 10px #0008}
.buddy .username{position:absolute;top:83px;left:-42px;width:175px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;color:#fff;font-weight:900;font-size:15px;text-shadow:0 2px 3px #000,0 0 8px #000,1px 1px 7px #000}
.buddy .shadow{position:absolute;left:14px;top:77px;width:63px;height:12px;border-radius:50%;background:#09051b80;filter:blur(6px);z-index:-1}
.face{animation:waddle .3s ease-in-out infinite alternate}
@keyframes waddle{from{transform:translateY(-2px) rotate(-5deg)}to{transform:translateY(2px) rotate(5deg)}}
.meme{position:absolute;top:0;left:0;max-width:none;width:clamp(100px,20vw,260px);height:clamp(100px,20vw,260px);object-fit:contain;filter:drop-shadow(0 7px 10px #0009);will-change:transform,opacity}
</style></head>
<body><div id="stage"></div>
<script>
const stage=document.getElementById('stage');
const buddies=new Map();
const rings=['#ffd66e','#d0dcf4','#e8ae83'];
let previousTime=0;
function baseY(){return Math.max(5,innerHeight - Math.min(130,Math.max(100,innerHeight*.09)));}
function makeBuddy(person,index){
 const el=document.createElement('div');el.className='buddy';
 const shadow=document.createElement('div');shadow.className='shadow';
 const face=document.createElement('div');face.className='face';
 const initials=document.createElement('span');initials.className='initial';face.append(initials);
 const badge=document.createElement('span');badge.className='rank';
 const name=document.createElement('span');name.className='username';
 el.append(shadow,face,badge,name);stage.append(el);
 const obj={id:person.userId,el,face,initials,badge,name,photo:null,avatarUrl:'',rank:index+1,
  x:Math.max(4,(innerWidth-98)*(index+.5)/3),y:baseY(),
  speed:26+Math.random()*24,direction:index%2?1:-1,
  nextExplore:performance.now()+10000+Math.random()*16000,exploreUntil:0,drag:null,seed:index*1.4};
 updateBuddy(obj,person,index);return obj;
}
function updateBuddy(b,person,index){
 b.rank=index+1;b.el.style.setProperty('--ring',rings[index]);
 b.badge.textContent=['1','2','3'][index];b.name.textContent='@'+person.username;
 b.initials.textContent=(person.username||'?').slice(0,1).toUpperCase();
 const raw=person.avatarUrl||'';
 let avatar='';
 try{const url=new URL(raw);if(url.protocol==='https:')avatar=url.href;}catch{}
 if(avatar!==b.avatarUrl){
  b.avatarUrl=avatar;if(b.photo)b.photo.remove();b.photo=null;
  if(avatar){
   const img=document.createElement('img');img.alt='';img.referrerPolicy='no-referrer';img.src=avatar;
   img.onerror=()=>{img.remove();if(b.photo===img)b.photo=null;};
   b.face.append(img);b.photo=img;
  }
 }
}
function setState(state) {
 const ids=new Set(state.top3.map(p=>p.userId));
 for(const [id,b] of buddies){
  if(!ids.has(id)){if(b.drag)b.drag.image.remove();b.el.remove();buddies.delete(id);}
 }
 state.top3.forEach((p,i)=>{
  let b=buddies.get(p.userId);
  if(!b){b=makeBuddy(p,i);buddies.set(p.userId,b);}
  else updateBuddy(b,p,i);
 });
}
function showMeme(event) {
 const b=buddies.get(event.userId);if(!b)return;
 if(b.drag){b.drag.image.remove();b.drag=null;}
 const image=document.createElement('img');image.className='meme';image.alt='';
 image.src='/memes/'+encodeURIComponent(event.filename);
 image.onerror=()=>image.remove();
 stage.append(image);
 b.drag={image,start:performance.now(),duration:6500,startX:b.x,travel:(Math.random()>.5?1:-1)*Math.min(340,innerWidth*.26)};
}
function move(time){
 const dt=Math.min(.05,Math.max(0,(time-previousTime)/1000||0));previousTime=time;
 const w=Math.max(96,innerWidth),h=Math.max(140,innerHeight),floor=baseY();
 for(const b of buddies.values()){
  let y=floor;
  if(b.drag){
   const d=b.drag;const p=Math.min(1,(time-d.start)/d.duration);
   b.x=Math.max(0,Math.min(w-95,d.startX+d.travel*Math.sin(p*Math.PI*.82)));
   y=floor-Math.sin(p*Math.PI)*Math.min(h*.52,410);
   d.image.style.transform='translate3d('+(b.x+52)+'px,'+(y-76)+'px,0) rotate('+(12*Math.sin(p*14))+'deg)';
   d.image.style.opacity=String(p>.82?Math.max(0,(1-p)/.18):1);
   if(p>=1){d.image.remove();b.drag=null;b.nextExplore=time+9000;}
  } else {
   b.x+=b.direction*b.speed*dt;
   if(b.x<2){b.x=2;b.direction=1;}
   if(b.x>w-96){b.x=w-96;b.direction=-1;}
   if(time>b.nextExplore && time>b.exploreUntil){
    b.exploreUntil=time+4800;
    b.nextExplore=time+18000+Math.random()*18000;
   }
   if(time<b.exploreUntil){
    const p=1-(b.exploreUntil-time)/4800;
    y=floor-Math.sin(Math.max(0,p)*Math.PI)*Math.min(h*.45,330);
   }
   y+=Math.sin(time/190+b.seed)*4;
  }
  b.y=y;
  b.el.style.transform='translate3d('+b.x+'px,'+Math.max(0,y)+'px,0)';
 }
 requestAnimationFrame(move);
}
requestAnimationFrame(move);
const events=new EventSource('/events');
events.onmessage=e=>{
 try{const packet=JSON.parse(e.data);
  if(packet.type==='state')setState(packet.state);
  if(packet.type==='meme')showMeme(packet.event);
 }catch(error){console.error('Meme Buddies:',error);}
};
</script></body></html>
