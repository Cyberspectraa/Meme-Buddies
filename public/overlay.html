<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meme Buddies — Desktop Goose-style Mod Overlay</title>
<style>
*{box-sizing:border-box}
html,body{padding:0;margin:0;width:100%;height:100%;overflow:hidden;background:transparent!important}
body{user-select:none;pointer-events:none;font-family:system-ui,"Segoe UI",sans-serif}
#stage{position:relative;width:100vw;height:100vh;overflow:hidden}
.buddy{position:absolute;top:0;left:0;width:86px;height:105px;will-change:transform;pointer-events:none;z-index:5}
.face{position:absolute;top:8px;left:9px;width:68px;height:68px;display:grid;place-items:center;overflow:hidden;border-radius:50%;border:4px solid #d18aff;background:linear-gradient(145deg,#51317b,#de4cba);box-shadow:0 4px 13px #000a}
.face img{width:100%;height:100%;object-fit:cover}
.initial{color:white;font-size:28px;font-weight:900}
.mod-label{position:absolute;top:0;left:1px;border-radius:10px;background:#d78afa;color:#271038;font-size:10px;font-weight:900;padding:3px 5px;box-shadow:0 3px 7px #0009;z-index:2}
.name{position:absolute;top:82px;left:-40px;width:167px;text-align:center;color:#fff;text-shadow:0 2px 3px black,0 0 6px black;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px;font-weight:900}
.shadow{position:absolute;top:74px;left:14px;width:60px;height:12px;background:#09051b66;filter:blur(7px);border-radius:50%;z-index:-1}
.buddy .face{animation:waddle .28s infinite alternate ease-in-out}
.buddy.sprinting .face{animation:sprint .12s infinite alternate ease-in-out}
@keyframes waddle{from{transform:rotate(-5deg) translateY(-2px)}to{transform:rotate(5deg) translateY(2px)}}
@keyframes sprint{from{transform:rotate(-13deg) translateY(-4px)}to{transform:rotate(13deg) translateY(3px)}}
.meme-window{position:absolute;top:0;left:0;border-radius:11px;overflow:hidden;border:1px solid #c9c7dc;background:#f9f8ff;box-shadow:0 16px 30px #0007,0 2px 8px #0006;will-change:transform,opacity;z-index:4;transform-origin:center;pointer-events:none}
.meme-bar{height:28px;background:linear-gradient(90deg,#eeeafc,#f8f6ff);display:flex;align-items:center;gap:7px;color:#27213e;padding:0 9px;border-bottom:1px solid #d9d3ed;font:750 11px "Segoe UI",sans-serif}
.meme-bar .dot{flex:none;width:8px;height:8px;border-radius:50%;background:#b47ae9;box-shadow:0 0 0 2px #b47ae929}
.meme-bar .file-name{min-width:0;flex:1;white-space:nowrap;text-overflow:ellipsis;overflow:hidden}
.meme-bar .controls{color:#7e749d;white-space:nowrap;letter-spacing:3px;font-size:12px}
.meme-content{display:grid;place-items:center;background:repeating-conic-gradient(#f7f5ff 0% 25%,#eeebfa 0% 50%) 50% / 20px 20px;padding:5px;overflow:hidden}
.meme-content img{display:block;max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 2px 3px #24203530)}
.tether{position:absolute;top:0;left:0;height:3px;border-radius:5px;background:repeating-linear-gradient(90deg,#d8be9e,#d8be9e 7px,#9c734b 7px,#9c734b 11px);transform-origin:left center;filter:drop-shadow(0 1px 3px #0007);pointer-events:none;z-index:4}
.trail{position:absolute;width:10px;height:15px;border-radius:60%;background:#30304590;filter:blur(2px);pointer-events:none;z-index:2;animation:vanish 1.3s forwards}
@keyframes vanish{to{opacity:0;transform:scale(.35)}}
</style></head>
<body><div id="stage"></div><script src="/drag-geometry.js"></script><script>
const stage=document.getElementById('stage');
const buddies=new Map();
let previousTime=0;
function portrait(){return innerHeight>innerWidth*1.25;}
function clamp(value,min,max){return Math.max(min,Math.min(max,value));}
function lowerBand(){return portrait()?innerHeight*.62:innerHeight-Math.min(130,Math.max(100,innerHeight*.09));}
function leftBound(){return portrait()?innerWidth*.06:4;}
function rightBound(){return Math.max(leftBound(),(portrait()?innerWidth*.85:innerWidth)-92);}
function homeX(index,total){
 const slots=Math.min(6,Math.max(1,total));
 const slot=index%slots;
 return leftBound()+((slot+.5)/slots)*(rightBound()-leftBound());
}
function makeBuddy(p,index,total){
 const el=document.createElement('div');el.className='buddy';
 const face=document.createElement('div');face.className='face';
 const initial=document.createElement('span');initial.className='initial';face.append(initial);
 const badge=document.createElement('span');badge.className='mod-label';badge.textContent='MOD';
 const name=document.createElement('span');name.className='name';
 const shadow=document.createElement('span');shadow.className='shadow';
 el.append(shadow,face,badge,name);stage.append(el);
 const b={id:p.userId,el,face,initial,name,img:null,avatarUrl:'',index,
  x:homeX(index,total),y:lowerBand(),direction:index%2?-1:1,
  speed:21+Math.random()*23,seed:Math.random()*6,action:null,
  nextExplore:performance.now()+10000+Math.random()*15000,exploreUntil:0};
 updateBuddy(b,p);return b;
}
function updateBuddy(b,p){
 b.name.textContent='@'+p.username;
 b.initial.textContent=(p.username||'?').slice(0,1).toUpperCase();
 let newUrl='';
 try{const u=new URL(p.avatarUrl||'');if(u.protocol==='https:')newUrl=u.href;}catch{}
 if(newUrl!==b.avatarUrl){
  b.avatarUrl=newUrl;
  if(b.img)b.img.remove();b.img=null;
  if(newUrl){
   const img=document.createElement('img');img.alt='';img.referrerPolicy='no-referrer';img.src=newUrl;
   img.onerror=()=>{img.remove();if(b.img===img)b.img=null;};
   b.face.append(img);b.img=img;
  }
 }
}
function setState(state){
 const list=state.activeMods||[];
 const ids=new Set(list.map(m=>m.userId));
 for(const [id,b] of buddies){
  if(ids.has(id))continue;
  if(b.action)clearAction(b.action);
  b.el.remove();buddies.delete(id);
 }
 list.forEach((p,i)=>{
  let b=buddies.get(p.userId);
  if(!b){b=makeBuddy(p,i,list.length);buddies.set(p.userId,b);}
  b.index=i;
  updateBuddy(b,p);
 });
}
const G=globalThis.MemeDragGeometry;
if(!G)throw new Error('Meme drag geometry failed to load');
function memeWindow(filename,username,popup){
 const el=document.createElement('div');el.className='meme-window';
 const title=document.createElement('div');title.className='meme-bar';
 const dot=document.createElement('span');dot.className='dot';
 const label=document.createElement('span');label.className='file-name';
 label.textContent='@'+username+' dragged in a meme';
 const controls=document.createElement('span');controls.className='controls';controls.textContent='— □ ×';
 title.append(dot,label,controls);
 const content=document.createElement('div');content.className='meme-content';
 const img=document.createElement('img');img.alt='Random meme';
 img.src='/memes/'+encodeURIComponent(filename);
 img.onerror=()=>{content.textContent='Meme image unavailable';};
 content.append(img);
 el.append(title,content);
 el.style.width=popup.width+'px';
 content.style.height=popup.imageHeight+'px';
 stage.append(el);
 return {el,content};
}
function clearAction(a){
 if(!a)return;
 if(a.rope)a.rope.remove();
 if(a.prop)a.prop.remove();
}
function actorDropPosition(side,popup){
 const at=side==='left'?popup.x+popup.width-25:popup.x-58;
 return G.clamp(at,leftBound(),rightBound());
}
function layoutAction(a){
 a.popup=G.placePopup(innerWidth,innerHeight,a.seedX,a.seedY);
 a.actorDropX=actorDropPosition(a.side,a.popup);
 if(a.prop)a.prop.style.width=a.popup.width+'px';
 if(a.content)a.content.style.height=a.popup.imageHeight+'px';
 a.homeX=homeX(a.index,Math.max(1,buddies.size));
}
function startMeme(event){
 const b=buddies.get(event.userId);
 if(!b)return;
 if(b.action)clearAction(b.action);
 const side=b.x<(leftBound()+rightBound())*.5?'left':'right';
 const a={start:performance.now(),index:b.index,side,startX:b.x,
   seedX:Math.random(),seedY:Math.random(),lastTrail:0,
   prop:null,content:null,rope:null,homeX:0};
 layoutAction(a); // Calculate the safe placement before creating an element.
 const popup=memeWindow(event.filename,event.username,a.popup);
 a.prop=popup.el;a.content=popup.content;
 a.rope=document.createElement('div');a.rope.className='tether';a.rope.style.visibility='hidden';stage.append(a.rope);
 b.action=a;
 b.el.classList.add('sprinting');
}
function footprints(x,y){
 if(Math.random()>.27)return;
 const e=document.createElement('span');e.className='trail';
 e.style.left=(x+37)+'px';e.style.top=(y+70)+'px';stage.append(e);
 setTimeout(()=>e.remove(),1300);
}
function positionRope(a,x1,y1,x2,y2){
 const dx=x2-x1,dy=y2-y1;
 a.rope.style.width=Math.hypot(dx,dy)+'px';
 a.rope.style.transform='translate3d('+x1+'px,'+y1+'px,0) rotate('+Math.atan2(dy,dx)+'rad)';
}
function advanceAction(b,t){
 const a=b.action;
 const age=(t-a.start)/1000;
 const frame=G.dragFrame(age,{
   popup:a.popup,side:a.side,actorStartX:a.startX,
   actorDropX:a.actorDropX,homeX:a.homeX,floor:lowerBand()
 });
 a.prop.style.visibility=frame.showProp?'visible':'hidden';
 a.prop.style.transform='translate3d('+frame.propX+'px,'+frame.propY+'px,0) rotate('+frame.angle+'deg)';
 if(frame.attached&&a.rope){
   a.rope.style.visibility='visible';
   const grabX=frame.propX+(a.side==='left'?a.popup.width-10:10);
   positionRope(a,frame.buddyX+42,frame.buddyY+38,grabX,frame.propY+14);
 }else if(a.rope){
   a.rope.style.visibility='hidden';
 }
 if((frame.phase==='fetch'||frame.phase==='drag'||frame.phase==='escape')&&t-a.lastTrail>210){
   footprints(frame.buddyX,frame.buddyY);a.lastTrail=t;
 }
 if(frame.phase==='finished'){
   if(a.rope)a.rope.remove();
   const prop=a.prop;
   // Drop remains completely in the safe scene area, visible for 2.5s before fading.
   prop.style.transform='translate3d('+a.popup.x+'px,'+a.popup.y+'px,0)';
   prop.style.opacity='1';
   setTimeout(()=>{
     if(!prop.isConnected)return;
     prop.style.transition='opacity .7s ease';
     prop.style.opacity='0';
     setTimeout(()=>prop.remove(),750);
   },2500);
   b.action=null;
   b.el.classList.remove('sprinting');
   b.nextExplore=t+11000;
 }
 return {x:frame.buddyX,y:frame.buddyY};
}
window.addEventListener('resize',()=>{
 for(const b of buddies.values()){
   b.x=G.clamp(b.x,leftBound(),rightBound());
   if(b.action)layoutAction(b.action);
 }
});
function animate(t){
 const dt=Math.min(.05,Math.max(0,(t-previousTime)/1000||0));previousTime=t;
 for(const b of buddies.values()){
  let y=lowerBand();
  if(b.action){
   const pos=advanceAction(b,t);b.x=pos.x;y=pos.y;
  }else{
   b.x+=b.direction*b.speed*dt;
   if(b.x<=leftBound()){b.x=leftBound();b.direction=1;}
   if(b.x>=rightBound()){b.x=rightBound();b.direction=-1;}
   if(t>b.nextExplore&&t>b.exploreUntil){
    b.exploreUntil=t+4300;b.nextExplore=t+14000+Math.random()*16000;
   }
   if(t<b.exploreUntil){
    const progress=1-(b.exploreUntil-t)/4300;
    y-=Math.sin(progress*Math.PI)*Math.min(innerHeight*(portrait()?.2:.42),205);
   }
   y+=Math.sin(t/180+b.seed)*3;
  }
  b.y=y;
  b.el.style.transform='translate3d('+b.x+'px,'+clamp(y,0,innerHeight-93)+'px,0)';
 }
 requestAnimationFrame(animate);
}
requestAnimationFrame(animate);
const events=new EventSource('/events');
events.onmessage=e=>{
 try{
  const packet=JSON.parse(e.data);
  if(packet.type==='state')setState(packet.state);
  if(packet.type==='meme')startMeme(packet.event);
 }catch(error){console.error('Meme Buddies overlay:',error);}
};
</script></body></html>
